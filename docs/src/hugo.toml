baseURL      = "https://carmelolg.github.io/JCAL/"
title        = "JCAL Docs"
theme        = "shiori"
locale       = "en"
paginate     = 20
publishDir   = ".."

[params]
  description    = "Official documentation for JCAL — Java Cellular Automata Library"
  author         = "carmelolg"
  version        = "2.1.0"
  currentVersion = "v2.1.0"
  tagline        = "A lightweight Java library for Cellular Automata simulations"
  licenseName    = "CC BY-NC-SA 4.0"
  license        = "https://github.com/carmelolg/JCAL/blob/master/LICENSE.md"
  github         = "https://github.com/carmelolg/JCAL"
  editBaseURL    = "https://github.com/carmelolg/JCAL/edit/master/docs/src/content"
  showEditButton = false
  logoText       = "JCAL"
  quickStartURL  = "/v2.1.0/getting-started/getting-started/"
  heroTitle      = "JCAL <span>Documentation</span>"
  dateFormat     = "January 2, 2006"

  # Multi-version support
  [[params.versions]]
    label = "v2.1.0"
    url   = "/v2.1.0/"
  [[params.versions]]
    label = "v2.0.0"
    url   = "/v2.0.0/"
  [[params.versions]]
    label = "v1.0.0"
    url   = "/v1.0.0/"

[markup]
  [markup.highlight]
    noClasses   = false
    lineNos     = false
    codeFences  = true
    guessSyntax = true
    tabWidth    = 2
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    name   = "Articles"
    url    = "/v2.0.0/articles/"
    weight = 1
  [[menu.main]]
    name   = "Design"
    url    = "/v2.0.0/design/"
    weight = 2
  [[menu.main]]
    name   = "Reference"
    url    = "/v2.0.0/reference/"
    weight = 3
